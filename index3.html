<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pacman-Project-Variation-Jam</title>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet"> 
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">


    <style>
      #gameCanvas {
        box-shadow: 10px 10px 48px blue;
        background: #000; /* Black canvas background */
      }
      h1 {
        text-align: center;
        font-family: "Luckiest Guy", sans-serif; /*pop art style title font?*/
        font-size: 110px;
        color: #FFD700;
        -webkit-text-stroke: 1px rgb(0, 0, 0); /*black stroke*/

        /* 3D text effect */
        text-shadow: 
         1px 1px 0px #ffffff, /* Black bottom layer */
         2px 2px 0px #ffffff, 
         3px 3px 0px #ffffff, 
         4px 4px 0px #ffffff, 
         5px 5px 0px #ffffff; /* Deepest Shadow */
      }

      body {
        display: flex;
        justify-content: center;
        overflow: hidden;
        height: 100vh;

        background: url('image/pacmanBackground.png') no-repeat center center fixed; /* background image */
        background-size: cover;
        position: relative;
     }
    
    </style>
  </head>
  <body>
    <div>
      <h1>PACMAN</h1>
      <canvas id="gameCanvas"></canvas>
    </div>
    <script src="./source3/game.js" type="module"></script>
    <script>
(() => {
  const canvas = document.getElementById('gameCanvas');
  if (!canvas) return;

  const wrapper = canvas.parentElement;

  // 保留原来的标题、画布和菜单布局，整体缩放
  Object.assign(document.body.style, {
    margin: '0',
    width: '100%',
    height: '100vh',
    overflow: 'hidden',
    display: 'block'
  });

  Object.assign(wrapper.style, {
    position: 'absolute',
    display: 'block',
    transformOrigin: 'top left'
  });

  function fitGame() {
    const width = Math.max(canvas.width, 640);

    wrapper.style.width = width + 'px';
    wrapper.style.transform = 'none';

    const height = wrapper.offsetHeight;
    if (!height) return;

    const padding = 16;
    const scale = Math.min(
      (window.innerWidth - padding * 2) / width,
      (window.innerHeight - padding * 2) / height,
      1
    );

    wrapper.style.left =
      (window.innerWidth - width * scale) / 2 + 'px';

    wrapper.style.top =
      (window.innerHeight - height * scale) / 2 + 'px';

    wrapper.style.transform = `scale(${scale})`;
  }

  window.addEventListener('resize', fitGame);
  window.addEventListener('load', fitGame);

  // 地图初始化或模式变化后，重新计算尺寸
  new MutationObserver(fitGame).observe(canvas, {
    attributes: true,
    attributeFilter: ['width', 'height']
  });

  if (document.fonts) {
    document.fonts.ready.then(fitGame);
  }

  fitGame();
})();
</script>
  </body>
</html>
